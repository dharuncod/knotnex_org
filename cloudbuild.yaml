steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Build production assets
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_PROD_API_URL=https://knotnex-backend-389663780266.asia-south1.run.app/api/v1'

  # 3. Deploy to Firebase Hosting
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['firebase-tools', 'deploy', '--only', 'hosting', '--project', 'knotnex-f68fd']
