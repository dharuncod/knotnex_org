<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Abstract Geometry & Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Glowing Glow Orb -->
  <circle cx="200" cy="180" r="100" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" />

  <!-- Center Artwork -->
  
      <!-- Generic High-Tech Hiring Beacon -->
      <g transform="translate(200, 195)">
        <circle cx="0" cy="0" r="48" fill="rgba(99,102,241,0.15)" stroke="url(#neonGlow)" stroke-width="2" />
        <rect x="-24" y="-18" width="48" height="36" rx="6" fill="#FFFFFF" />
        <path d="M-10,-18 L-10,-26 C-10,-28 -8,-30 -6,-30 L6,-30 C8,-30 10,-28 10,-26 L10,-18" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round" />
        <circle cx="0" cy="0" r="5" fill="#4F46E5" />
      </g>
    

  <!-- Top Hiring Badge -->
  <rect x="28" y="28" width="135" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#10B981" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">WE'RE HIRING</text>

  <!-- Brand Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#6366F1" letter-spacing="1.5">KNOTNEX</text>

  <!-- Title & Subtitle Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6366F1" letter-spacing="2.5">KNOTNEX COLLECTIVE</text>
  <text x="28" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">CAREER OPPORTUNITY</text>
  <text x="28" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="url(#neonGlow)" letter-spacing="0.5">JOIN OUR GLOBAL TEAM</text>

  <!-- Bottom Info Card -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">EMPLOYMENT</text>
    <text x="40" y="459" font-size="12" font-weight="700">Competitive</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Global</text>
  </g>
</svg>