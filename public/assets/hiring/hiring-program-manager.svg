<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1505" />
      <stop offset="50%" stop-color="#4D3608" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Abstract Geometry & Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Glowing Glow Orb -->
  <circle cx="200" cy="180" r="100" fill="#F59E0B" opacity="0.25" filter="url(#glow)" />

  <!-- Center Artwork -->
  
      <!-- Sprint Roadmap & Milestone Target -->
      <g transform="translate(200, 195)">
        <rect x="-65" y="-35" width="130" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
        <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
        <line x1="-50" y1="10" x2="20" y2="10" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
        <circle cx="-50" cy="-10" r="5" fill="#FBBF24" />
        <circle cx="0" cy="-10" r="5" fill="#FBBF24" />
        <circle cx="50" cy="-10" r="5" fill="#FFFFFF" />
      </g>
    

  <!-- Top Hiring Badge -->
  <rect x="28" y="28" width="135" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#10B981" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">WE'RE HIRING</text>

  <!-- Brand Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FBBF24" letter-spacing="1.5">KNOTNEX</text>

  <!-- Title & Subtitle Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="2.5">OPERATIONS & DELIVERY</text>
  <text x="28" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">TECHNICAL PM</text>
  <text x="28" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="url(#neonGlow)" letter-spacing="0.5">CROSS-FUNCTIONAL SCALE</text>

  <!-- Bottom Info Card -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">EMPLOYMENT</text>
    <text x="40" y="459" font-size="12" font-weight="700">Full-time</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Seattle, WA</text>
  </g>
</svg>