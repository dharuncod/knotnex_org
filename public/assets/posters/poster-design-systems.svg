<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="45%" stop-color="#4C1D95" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="tokenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgGrad6)" />

  <!-- Floating Design Tokens & UI Component Cards -->
  <g transform="translate(200, 175)">
    <!-- Layer 3 (Back) -->
    <rect x="-65" y="-55" width="130" height="70" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" transform="rotate(-12)" />
    <!-- Layer 2 (Middle) -->
    <rect x="-65" y="-45" width="130" height="70" rx="12" fill="rgba(192, 132, 252, 0.18)" stroke="#C084FC" stroke-width="1.8" transform="rotate(6)" />
    <!-- Layer 1 (Front glass card) -->
    <rect x="-65" y="-35" width="130" height="70" rx="12" fill="rgba(236, 72, 153, 0.28)" stroke="url(#tokenGlow)" stroke-width="2.2" />
    
    <!-- Mini UI tokens inside front card -->
    <circle cx="-35" cy="0" r="10" fill="#EC4899" filter="url(#glow6)" />
    <rect x="-15" y="-8" width="55" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-15" y="4" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.6)" />
  </g>

  <!-- Glowing Radial Orb -->
  <circle cx="310" cy="130" r="90" fill="#7C3AED" opacity="0.4" filter="url(#glow6)" />
  <circle cx="300" cy="120" r="45" fill="#EC4899" opacity="0.5" filter="url(#glow6)" />

  <!-- Top Badge -->
  <rect x="28" y="28" width="140" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#C084FC" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">DESIGN &amp; UI</text>

  <!-- Year Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#C084FC" letter-spacing="2">2026</text>

  <!-- Event Title Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C084FC" letter-spacing="2.5">GLOBAL UI SUMMIT</text>
  <text x="28" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">DESIGN SYSTEMS</text>
  <text x="28" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#tokenGlow)" letter-spacing="-0.5">CONFERENCE '26</text>

  <!-- Bottom Info Bar -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad6)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">DATE</text>
    <text x="40" y="459" font-size="12" font-weight="700">Jul 10 - 11, 2026</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Seattle Convention Hall</text>
  </g>
</svg>
