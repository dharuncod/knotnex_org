<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A044E" />
      <stop offset="45%" stop-color="#831843" />
      <stop offset="85%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgGrad5)" />

  <!-- Wellness Concentric Rings -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="rgba(253, 164, 175, 0.15)" stroke-width="1.5" />
  <circle cx="200" cy="180" r="105" fill="none" stroke="rgba(253, 164, 175, 0.22)" stroke-width="2" />
  <circle cx="200" cy="180" r="80" fill="none" stroke="rgba(254, 215, 170, 0.3)" stroke-width="2.5" />

  <!-- Heart / Bloom Symbol in Center -->
  <g transform="translate(200, 180)">
    <path d="M0,25 C-35,-15 -55,-40 -25,-60 C0,-60 0,-30 0,-30 C0,-30 0,-60 25,-60 C55,-40 35,-15 0,25 Z" fill="rgba(255,255,255,0.2)" stroke="url(#roseGlow)" stroke-width="3" />
    <circle cx="0" cy="-20" r="8" fill="#FFFFFF" filter="url(#glow5)" />
    <!-- Radiating wellness petals -->
    <circle cx="-60" cy="0" r="4" fill="#FDA4AF" />
    <circle cx="60" cy="0" r="4" fill="#FDA4AF" />
    <circle cx="0" cy="-75" r="4" fill="#FED7AA" />
    <circle cx="0" cy="45" r="4" fill="#FED7AA" />
  </g>

  <!-- Top Badge -->
  <rect x="28" y="28" width="145" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#FDA4AF" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">PUBLIC CARE</text>

  <!-- Year Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FDA4AF" letter-spacing="2">2026</text>

  <!-- Event Title Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FDA4AF" letter-spacing="2.5">COMMUNITY OUTREACH</text>
  <text x="28" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">HEALTH &amp; WELLNESS</text>
  <text x="28" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#roseGlow)" letter-spacing="-0.5">DRIVE 2026</text>

  <!-- Bottom Info Bar -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad5)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">DATE</text>
    <text x="40" y="459" font-size="12" font-weight="700">Dec 01 - 03, 2026</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Central Center, Austin</text>
  </g>
</svg>
