<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="45%" stop-color="#311370" />
      <stop offset="85%" stop-color="#5522D8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad1)" />

  <!-- Abstract Geometry & Grid -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Glowing Radial Orb -->
  <circle cx="280" cy="160" r="110" fill="#6336EB" opacity="0.6" filter="url(#glow1)" />
  <circle cx="320" cy="130" r="60" fill="#00F5FF" opacity="0.5" filter="url(#glow1)" />

  <!-- Isometric Tech Hex / Cube Art -->
  <g transform="translate(200, 190)">
    <!-- Outer ring -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="url(#neonGlow1)" stroke-width="2.5" />
    <!-- Inner facets -->
    <polygon points="0,-70 60,-35 0,0 -60,-35" fill="rgba(0, 245, 255, 0.18)" />
    <polygon points="60,-35 60,35 0,70 0,0" fill="rgba(168, 85, 247, 0.25)" />
    <polygon points="-60,-35 0,0 0,70 -60,35" fill="rgba(99, 54, 235, 0.35)" />
    <!-- Center Core -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#glow1)" />
    <circle cx="0" cy="0" r="7" fill="#00D2FF" />
  </g>

  <!-- Constellation Nodes -->
  <g stroke="#00F5FF" stroke-width="1.2" opacity="0.75">
    <line x1="80" y1="120" x2="140" y2="155" />
    <line x1="260" y1="155" x2="330" y2="120" />
    <line x1="140" y1="225" x2="80" y2="270" />
    <line x1="260" y1="225" x2="320" y2="280" />
  </g>
  <circle cx="80" cy="120" r="4" fill="#00F5FF" />
  <circle cx="330" cy="120" r="4" fill="#A855F7" />
  <circle cx="80" cy="270" r="3.5" fill="#EC4899" />
  <circle cx="320" cy="280" r="4" fill="#00F5FF" />

  <!-- Top Badge -->
  <rect x="28" y="28" width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#10B981" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">AI &amp; CLOUD</text>

  <!-- Year Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#00F5FF" letter-spacing="2">2026</text>

  <!-- Event Title Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00F5FF" letter-spacing="2.5">ANNUAL SUMMIT</text>
  <text x="28" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">YOUTH TECH</text>
  <text x="28" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#neonGlow1)" letter-spacing="-0.5">SUMMIT 2026</text>

  <!-- Bottom Info Bar -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">DATE</text>
    <text x="40" y="459" font-size="12" font-weight="700">Oct 15 - 18, 2026</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Moscone Center, SF</text>
  </g>
</svg>
