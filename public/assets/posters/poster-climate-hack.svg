<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E16" />
      <stop offset="40%" stop-color="#064E3B" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgGrad2)" />

  <!-- Abstract Solar Waves & Circuits -->
  <path d="M-50,220 Q100,140 250,230 T550,180" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2.5" />
  <path d="M-50,250 Q120,170 270,260 T550,210" fill="none" stroke="rgba(167, 243, 208, 0.2)" stroke-width="1.8" />
  <path d="M-50,280 Q140,200 290,290 T550,240" fill="none" stroke="rgba(252, 211, 77, 0.25)" stroke-width="2" />

  <!-- Glowing Eco Sun / Energy Orb -->
  <circle cx="310" cy="140" r="100" fill="#10B981" opacity="0.4" filter="url(#glow2)" />
  <circle cx="290" cy="120" r="45" fill="#FCD34D" opacity="0.5" filter="url(#glow2)" />

  <!-- Eco Leaf / Circuit Art Graphic -->
  <g transform="translate(190, 180)">
    <!-- Leaf outline -->
    <path d="M0,-65 C45,-60 65,-20 60,30 C55,65 20,75 0,80 C-20,75 -55,65 -60,30 C-65,-20 -45,-60 0,-65 Z" fill="rgba(6, 78, 59, 0.45)" stroke="url(#greenGlow)" stroke-width="2.5" />
    <!-- Center spine & circuit branches -->
    <line x1="0" y1="-50" x2="0" y2="70" stroke="#A7F3D0" stroke-width="2" />
    <line x1="0" y1="-20" x2="35" y2="-35" stroke="#A7F3D0" stroke-width="1.5" />
    <line x1="0" y1="0" x2="-35" y2="-15" stroke="#A7F3D0" stroke-width="1.5" />
    <line x1="0" y1="20" x2="35" y2="5" stroke="#A7F3D0" stroke-width="1.5" />
    <line x1="0" y1="40" x2="-30" y2="25" stroke="#A7F3D0" stroke-width="1.5" />
    <circle cx="35" cy="-35" r="3.5" fill="#FCD34D" />
    <circle cx="-35" cy="-15" r="3.5" fill="#34D399" />
    <circle cx="35" cy="5" r="3.5" fill="#34D399" />
    <circle cx="-30" cy="25" r="3.5" fill="#FCD34D" />
  </g>

  <!-- Top Badge -->
  <rect x="28" y="28" width="135" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="42" cy="41" r="4" fill="#34D399" />
  <text x="54" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">48H SPRINT</text>

  <!-- Year Label -->
  <text x="372" y="47" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#34D399" letter-spacing="2">2026</text>

  <!-- Event Title Block -->
  <text x="28" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="2.5">GLOBAL HACKATHON</text>
  <text x="28" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">CLIMATE ACTION</text>
  <text x="28" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#greenGlow)" letter-spacing="-0.5">HACKATHON '26</text>

  <!-- Bottom Info Bar -->
  <rect x="24" y="420" width="352" height="54" rx="12" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">DATE</text>
    <text x="40" y="459" font-size="12" font-weight="700">Nov 05 - 07, 2026</text>
    <text x="200" y="442" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)">LOCATION</text>
    <text x="200" y="459" font-size="12" font-weight="700">Berlin &amp; Online</text>
  </g>
</svg>
